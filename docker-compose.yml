version: '3.8'

services:
  # Main vLLM Inference Server
  qwen-vllm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-qwen-vllm-server
    image: my-qwen-vllm:latest
    
    # Port mapping
    ports:
      - "8000:8000"
    
    # Environment variables
    environment:
      - VLLM_PORT=8000
      - VLLM_HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0  # Change to use different GPU
    
    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']  # GPU 0
              capabilities: [gpu]
    
    # Health check for orchestration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Always restart if container crashes
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Resource limits
    mem_limit: 8g
    memswap_limit: 8g

  # Optional: Prometheus for metrics (advanced)
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'

  # Optional: Grafana for monitoring (advanced)
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   depends_on:
  #     - prometheus

networks:
  default:
    name: qwen-vllm-network
    driver: bridge

volumes:
  cache:
    driver: local
  logs:
    driver: local
